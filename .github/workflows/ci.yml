name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite includes integration tests that read the real sample case
      # from public/data, so a regression in the NIfTI parser or the mesher
      # fails here rather than in the browser.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
